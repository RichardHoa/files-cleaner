[package]
name = "files-cleaner-grouping"
version = "0.1.0"
edition = "2021"
description = "Suggested Folders from what's inside the files: reading, the Grouping Models on llama.cpp, and clustering (ADR-0004)"

[dependencies]
blake3 = "1.8.7"
files-cleaner-core = { path = "../core" }
# `pdfium_7881` must match the PDFium release bundled with the app.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Metal on macOS; Vulkan on Windows and Linux, which llama.cpp leaves for the
# CPU when there's no usable Vulkan GPU.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
