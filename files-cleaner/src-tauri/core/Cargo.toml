[package]
name = "files-cleaner-core"
version = "0.1.0"
edition = "2021"
description = "Scanning, planning, journaling and Undo for Files Cleaner, with no Tauri dependency (ADR-0003)"

[dependencies]
blake3 = "1.8.7"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the config's keys in the order the user wrote them when Settings saves it.
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSValue", "NSError", "NSFileManager"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
