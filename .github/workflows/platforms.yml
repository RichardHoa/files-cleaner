# Builds, tests and packages the app on each OS it ships for, with the
# grouping engine's llama.cpp on Metal (macOS) or Vulkan (Windows, Linux).
# Runs only for a pushed version tag (v0.1.0), which also publishes the
# installers as a GitHub Release once every OS has built.
name: Platforms

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux packages (Tauri, Vulkan and SPIR-V headers, shader compiler)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev \
            libvulkan-dev spirv-headers glslc

      # Sets VULKAN_SDK. The runtime brings vulkan-1.dll, which build.rs bundles.
      - name: Install the Vulkan SDK and runtime
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Show where vulkan-1.dll is
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Filter vulkan-1.dll `
            $env:VULKAN_SDK, "$env:SystemRoot\System32" | Select-Object -ExpandProperty FullName

      # llama.cpp builds with Ninja, as its own Windows CI does: under the
      # Visual Studio generator its shader tool fails with C1041 (a PDB clash).
      - name: Set up the MSVC command line for Ninja
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@ced9887c29958f18f71b18c99d9eb0837859434c # v3.0.2
        with:
          arch: x64
          exportVCVarsall: true

      - name: Build with Ninja
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # cl.exe can't open files past MAX_PATH (260), and llama.cpp's shader
      # tool nests its build ~270 characters deep under src-tauri/target,
      # failing with C1041. Cargo builds through a short junction instead;
      # the files stay in src-tauri/target for the cache and the upload.
      - name: Shorten the target path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = New-Item -ItemType Directory -Force files-cleaner/src-tauri/target
          New-Item -ItemType Junction -Path D:\t -Target $target.FullName
          "CARGO_TARGET_DIR=D:\t" >> $env:GITHUB_ENV

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: files-cleaner/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: files-cleaner/src-tauri

      - name: Install npm packages
        working-directory: files-cleaner
        run: npm ci

      - name: Build the Rust workspace
        working-directory: files-cleaner/src-tauri
        run: cargo build --workspace --all-targets

      - name: Rust tests
        working-directory: files-cleaner/src-tauri
        run: cargo test --workspace

      - name: JavaScript tests
        working-directory: files-cleaner
        run: npm test

      - name: Package the app
        working-directory: files-cleaner
        run: npm run tauri build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bundle-${{ matrix.os }}
          path: files-cleaner/src-tauri/target/release/bundle/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: bundle-*
          path: release-artifacts
          merge-multiple: true

      # The installers only: the .app inside the macOS bundle is a folder,
      # which the .dmg already carries.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/dmg/*.dmg
            release-artifacts/msi/*.msi
            release-artifacts/nsis/*.exe
            release-artifacts/deb/*.deb
            release-artifacts/rpm/*.rpm
            release-artifacts/appimage/*.AppImage