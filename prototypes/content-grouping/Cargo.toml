[package]
name = "content-grouping-prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway, read-only prototype: Suggested Folders from what's inside the loose files of a Scan Root"

# ONNX Runtime comes prebuilt (ort's download-binaries), PDFium is a prebuilt
# library loaded at run time (pdfium-render with no `static` feature), and the
# models and PDFium are fetched once with the system `curl`. The LLM runs on
# candle, pinned at the version this was written against.
[dependencies]
candle-core = "=0.9.2"
candle-transformers = "=0.9.2"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
# `pdfium_7881` must match `extract::PDFIUM_RELEASE`.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The LLM on the GPU through Metal; its shaders are compiled at run time.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", features = ["metal"] }
candle-transformers = { version = "=0.9.2", features = ["metal"] }

[dev-dependencies]
tempfile = "3"
