# Builds, tests and packages the app on each OS it ships for, with the
# grouping engine's llama.cpp on Metal (macOS) or Vulkan (Windows, Linux).
# Pushing a version tag (v0.1.0) also publishes the installers as a GitHub
# Release, once every OS has built.
name: Platforms

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux packages (Tauri, Vulkan and SPIR-V headers, shader compiler)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libvulkan-dev spirv-headers glslc

      # Sets VULKAN_SDK. The runtime brings vulkan-1.dll, which build.rs bundles.
      - name: Install the Vulkan SDK and runtime
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Show where vulkan-1.dll is
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Filter vulkan-1.dll `
            $env:VULKAN_SDK, "$env:SystemRoot\System32" | Select-Object -ExpandProperty FullName

      # llama.cpp builds with Ninja, as its own Windows CI does: under the
      # Visual Studio generator its shader tool fails with C1041 (a PDB clash).
      - name: Set up the MSVC command line for Ninja
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4

      - name: Build with Ninja
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # cl.exe can't open files past MAX_PATH (260), and llama.cpp's shader
      # tool nests its build ~270 characters deep under src-tauri/target,
      # failing with C1041. Cargo builds through a short junction instead;
      # the files stay in src-tauri/target for the cache and the upload.
      - name: Shorten the target path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = New-Item -ItemType Directory -Force files-cleaner/src-tauri/target
          New-Item -ItemType Junction -Path D:\t -Target $target.FullName
          "CARGO_TARGET_DIR=D:\t" >> $env:GITHUB_ENV

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: files-cleaner/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: files-cleaner/src-tauri -> target

      - name: Install npm packages
        working-directory: files-cleaner
        run: npm ci

      - name: Build the Rust workspace
        working-directory: files-cleaner/src-tauri
        run: cargo build --workspace --all-targets

      - name: Rust tests
        working-directory: files-cleaner/src-tauri
        run: cargo test --workspace

      - name: JavaScript tests
        working-directory: files-cleaner
        run: npm test

      - name: Package the app
        working-directory: files-cleaner
        run: npm run tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-${{ matrix.os }}
          path: files-cleaner/src-tauri/target/release/bundle/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bundle-*

      # The installers only: the .app inside the macOS bundle is a folder,
      # which the .dmg already carries.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bundle-macos-latest/dmg/*.dmg
            bundle-windows-latest/msi/*.msi
            bundle-windows-latest/nsis/*.exe
            bundle-ubuntu-24.04/deb/*.deb
            bundle-ubuntu-24.04/rpm/*.rpm
            bundle-ubuntu-24.04/appimage/*.AppImage
