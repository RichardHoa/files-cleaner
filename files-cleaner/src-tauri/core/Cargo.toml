[package]
name = "files-cleaner-core"
version = "0.1.0"
edition = "2021"
description = "Scanning, planning, journaling and Undo for Files Cleaner, with no Tauri dependency (ADR-0003)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSValue", "NSError"] }

[dev-dependencies]
tempfile = "3"
